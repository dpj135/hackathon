<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1280" viewBox="0 0 1200 1280"><rect width="100%" height="100%" fill="white"/>
<text x="600" y="38" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans,Droid Sans Fallback,Microsoft YaHei,sans-serif" font-size="34" fill="#183047">读取与缓存的两个决策阶段</text>
<rect x="340" y="90" width="520" height="70" rx="12" fill="#f1f4f7" stroke="#b8c9dc"/>
<text x="600.0" y="125.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans,Droid Sans Fallback,Microsoft YaHei,sans-serif" font-size="27" fill="#183047">一批读取请求到达</text>
<rect x="340" y="200" width="520" height="80" rx="12" fill="#f1f4f7" stroke="#b8c9dc"/>
<text x="600.0" y="225.5" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans,Droid Sans Fallback,Microsoft YaHei,sans-serif" font-size="27" fill="#183047">框架检查KV池缓存</text>
<text x="600.0" y="257.5" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans,Droid Sans Fallback,Microsoft YaHei,sans-serif" font-size="21" fill="#183047">按设备、SSD起点和长度精确匹配</text>
<polyline points="600,160 600,200" fill="none" stroke="#64748b" stroke-width="2"/>
<polygon points="600,200 595.0,188.0 605.0,188.0" fill="#64748b"/>
<rect x="100" y="335" width="670" height="85" rx="12" fill="#eaf2ff" stroke="#b8c9dc"/>
<text x="435.0" y="363.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans,Droid Sans Fallback,Microsoft YaHei,sans-serif" font-size="26" fill="#183047">1. 整理请求与容量分块</text>
<text x="435.0" y="394.5" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans,Droid Sans Fallback,Microsoft YaHei,sans-serif" font-size="21" fill="#183047">建立目标片段索引，更新已见访问记录</text>
<polyline points="470,280 470,307 435,307 435,335" fill="none" stroke="#64748b" stroke-width="2"/>
<polygon points="435,335 430.0,323.0 440.0,323.0" fill="#64748b"/>
<text x="355" y="307" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans,Droid Sans Fallback,Microsoft YaHei,sans-serif" font-size="20" fill="#183047">未命中</text>
<rect x="865" y="335" width="270" height="120" rx="12" fill="#f1f4f7" stroke="#b8c9dc"/>
<text x="1000.0" y="366.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans,Droid Sans Fallback,Microsoft YaHei,sans-serif" font-size="27" fill="#183047">缓存命中</text>
<text x="1000.0" y="398.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans,Droid Sans Fallback,Microsoft YaHei,sans-serif" font-size="21" fill="#183047">框架自动H2D搬运</text>
<text x="1000.0" y="427.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans,Droid Sans Fallback,Microsoft YaHei,sans-serif" font-size="21" fill="#183047">带宽与调用仍计费</text>
<polyline points="735,280 735,307 1000,307 1000,335" fill="none" stroke="#64748b" stroke-width="2"/>
<polygon points="1000,335 995.0,323.0 1005.0,323.0" fill="#64748b"/>
<text x="925" y="290" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans,Droid Sans Fallback,Microsoft YaHei,sans-serif" font-size="20" fill="#183047">命中</text>
<rect x="100" y="460" width="670" height="85" rx="12" fill="#eaf2ff" stroke="#b8c9dc"/>
<text x="435.0" y="488.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans,Droid Sans Fallback,Microsoft YaHei,sans-serif" font-size="26" fill="#183047">2. 联合选择合并边界与路径</text>
<text x="435.0" y="519.5" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans,Droid Sans Fallback,Microsoft YaHei,sans-serif" font-size="21" fill="#183047">三条前台路径与不同分组一起比较</text>
<polyline points="435,420 435,460" fill="none" stroke="#64748b" stroke-width="2"/>
<polygon points="435,460 430.0,448.0 440.0,448.0" fill="#64748b"/>
<rect x="100" y="585" width="670" height="85" rx="12" fill="#eaf2ff" stroke="#b8c9dc"/>
<text x="435.0" y="613.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans,Droid Sans Fallback,Microsoft YaHei,sans-serif" font-size="26" fill="#183047">3. 观察窗口比较</text>
<text x="435.0" y="644.5" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans,Droid Sans Fallback,Microsoft YaHei,sans-serif" font-size="21" fill="#183047">有限已见批次内试算，只选择当前批次计划</text>
<polyline points="435,545 435,585" fill="none" stroke="#64748b" stroke-width="2"/>
<polygon points="435,585 430.0,573.0 440.0,573.0" fill="#64748b"/>
<rect x="100" y="710" width="670" height="85" rx="12" fill="#eaf2ff" stroke="#b8c9dc"/>
<text x="435.0" y="738.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans,Droid Sans Fallback,Microsoft YaHei,sans-serif" font-size="26" fill="#183047">4. 输出计划与工作账本</text>
<text x="435.0" y="769.5" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans,Droid Sans Fallback,Microsoft YaHei,sans-serif" font-size="21" fill="#183047">框架执行读取和复制，逐请求触发完成回调</text>
<polyline points="435,670 435,710" fill="none" stroke="#64748b" stroke-width="2"/>
<polygon points="435,710 430.0,698.0 440.0,698.0" fill="#64748b"/>
<rect x="100" y="835" width="670" height="115" rx="12" fill="#eaf2ff" stroke="#b8c9dc"/>
<text x="435.0" y="863.5" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans,Droid Sans Fallback,Microsoft YaHei,sans-serif" font-size="26" fill="#183047">5. 完成反馈与缓存准入</text>
<text x="435.0" y="895.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans,Droid Sans Fallback,Microsoft YaHei,sans-serif" font-size="21" fill="#183047">前台读完：检查复用、容量、新鲜度、收益和预算</text>
<text x="435.0" y="924.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans,Droid Sans Fallback,Microsoft YaHei,sans-serif" font-size="21" fill="#183047">命中完成：只更新预算反馈，不再提升</text>
<polyline points="435,795 435,835" fill="none" stroke="#64748b" stroke-width="2"/>
<polygon points="435,835 430.0,823.0 440.0,823.0" fill="#64748b"/>
<polyline points="1000,455 1000,865 770,865" fill="none" stroke="#64748b" stroke-width="2"/>
<polygon points="770,865 782.0,860.0 782.0,870.0" fill="#64748b"/>
<text x="1090" y="660" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans,Droid Sans Fallback,Microsoft YaHei,sans-serif" font-size="20" fill="#183047">完成反馈</text>
<rect x="100" y="1000" width="670" height="85" rx="12" fill="#eaf2ff" stroke="#b8c9dc"/>
<text x="435.0" y="1028.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans,Droid Sans Fallback,Microsoft YaHei,sans-serif" font-size="26" fill="#183047">6. 选择提升来源并提交</text>
<text x="435.0" y="1059.5" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans,Droid Sans Fallback,Microsoft YaHei,sans-serif" font-size="21" fill="#183047">从HBM或SSD写入缓存；允许当前时刻起执行</text>
<polyline points="435,950 435,1000" fill="none" stroke="#64748b" stroke-width="2"/>
<polygon points="435,1000 430.0,988.0 440.0,988.0" fill="#64748b"/>
<text x="530" y="975" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans,Droid Sans Fallback,Microsoft YaHei,sans-serif" font-size="20" fill="#183047">准入通过</text>
<rect x="865" y="1000" width="270" height="85" rx="12" fill="#f1f4f7" stroke="#b8c9dc"/>
<text x="1000.0" y="1028.5" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans,Droid Sans Fallback,Microsoft YaHei,sans-serif" font-size="25" fill="#183047">本次不提升</text>
<text x="1000.0" y="1059.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans,Droid Sans Fallback,Microsoft YaHei,sans-serif" font-size="20" fill="#183047">本次完成反馈结束</text>
<polyline points="770,920 1000,920 1000,1000" fill="none" stroke="#64748b" stroke-width="2"/>
<polygon points="1000,1000 995.0,988.0 1005.0,988.0" fill="#64748b"/>
<text x="1040" y="960" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans,Droid Sans Fallback,Microsoft YaHei,sans-serif" font-size="20" fill="#183047">不提升</text>
<rect x="100" y="1125" width="670" height="85" rx="12" fill="#f1f4f7" stroke="#b8c9dc"/>
<text x="435.0" y="1153.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans,Droid Sans Fallback,Microsoft YaHei,sans-serif" font-size="26" fill="#183047">框架执行提升并插入缓存池</text>
<text x="435.0" y="1184.5" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans,Droid Sans Fallback,Microsoft YaHei,sans-serif" font-size="21" fill="#183047">供后续同键请求命中；尾部提升计入总历时</text>
<polyline points="435,1085 435,1125" fill="none" stroke="#64748b" stroke-width="2"/>
<polygon points="435,1125 430.0,1113.0 440.0,1113.0" fill="#64748b"/>
<polyline points="100,1168 40,1168 40,240 340,240" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="7 7"/>
<polygon points="340,240 328.0,245.0 328.0,235.0" fill="#64748b"/>
<text x="600" y="1250" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans,Droid Sans Fallback,Microsoft YaHei,sans-serif" font-size="21" fill="#183047">蓝色：策略决定    灰色：框架执行    虚线：缓存影响后续请求</text>
</svg>